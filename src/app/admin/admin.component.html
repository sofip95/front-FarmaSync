<div class="chat-section">
  <h3>Agente Admin</h3>
  <div class="chat-input">
    <input type="text" placeholder="Escribe tu mensaje...">
    <button>▶</button>
  </div>
</div>
<div class="container">
  <h2>Inventario Crítico</h2>

  <table>
    <thead>
      <tr>
        <th>Producto</th>
        <th>Stock actual</th>
        <th>Proveedor</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of inventario">
        <td>{{ p.nombre }}</td>
        <td>{{ p.stock }}</td>
        <td>{{ p.proveedor }}</td>
        <td><button (click)="reordenar(p)">Reordenar</button></td>
      </tr>
    </tbody>
  </table>
</div>
